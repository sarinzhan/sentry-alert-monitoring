server {
    listen 80;

    root /usr/share/nginx/html;

    location = / {
        return 302 /web/;
    }

    # the SPA: assets by path, anything else falls back to index.html
    location /web/ {
        try_files $uri $uri/ /web/index.html;
    }

    # API calls go to the bot container on the shared docker network.
    # Resolve via Docker DNS per request (a static proxy_pass host is resolved
    # once at startup: nginx wouldn't start with the bot down, and would keep
    # a stale IP after the bot container is recreated).
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $bot http://sentry-telegram:8080;
        proxy_pass $bot;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
