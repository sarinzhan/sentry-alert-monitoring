server {
    listen 80;

    root /usr/share/nginx/html;

    # emit relative Location headers: nginx builds absolute redirects from
    # $host (no port), which breaks redirects behind the 8081->80 port
    # mapping and behind the host nginx
    absolute_redirect off;

    location = / {
        return 302 /admin-web/;
    }

    # API calls go to the bot container on the shared docker network, with the
    # /admin-web prefix stripped (the bot serves /api/ at the root).
    # Resolve via Docker DNS per request (a static proxy_pass host is resolved
    # once at startup: nginx wouldn't start with the bot down, and would keep
    # a stale IP after the bot container is recreated).
    resolver 127.0.0.11 valid=10s;

    location /admin-web/api/ {
        set $bot http://sentry-telegram:8080;
        rewrite ^/admin-web(/api/.*)$ $1 break;
        proxy_pass $bot;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # /api/explain runs an agentic LLM — minutes, not seconds
        proxy_read_timeout 300s;
    }

    # the SPA: assets by path, anything else falls back to index.html
    location /admin-web/ {
        try_files $uri $uri/ /admin-web/index.html;
    }
}
