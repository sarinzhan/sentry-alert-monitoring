[pytest]
markers =
    flow(slug, step): links the test to a flow step (slugs from flows.py); shown in the UI
    needs(*requirements): human-readable prerequisites (env vars, stage state); shown in the UI
    destructive: creates real applications / burns rate limits on stage; deselected by default
; destructive tests only run when explicitly selected (the runner clears addopts)
addopts = -m "not destructive"
